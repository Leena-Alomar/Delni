spring.application.name=Delni

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Delni}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

server.web.error.include-message=never
server.web.error.include-stacktrace=never

google.maps.api.key=${GOOGLE_MAPS_API_KEY:}

tiktok.api.key=${RAPIDAPI_KEY:}
tiktok.schedule.enabled=${TIKTOK_SCHEDULE_ENABLED:true}
tiktok.schedule.fixed-rate-ms=${TIKTOK_SCHEDULE_FIXED_RATE_MS:21600000}
tiktok.trend.window-days=${TIKTOK_TREND_WINDOW_DAYS:14}
tiktok.trend.min-recent-videos=${TIKTOK_TREND_MIN_RECENT_VIDEOS:3}
tiktok.trend.min-local-videos=${TIKTOK_TREND_MIN_LOCAL_VIDEOS:2}
openai.api.key=${OPENAI_API_KEY:}
openai.api.model=${OPENAI_MODEL:gpt-5.4-mini}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/responses}
weather.api.url=${WEATHER_API_URL:https://api.open-meteo.com/v1/forecast}
weather.api.timezone=${WEATHER_API_TIMEZONE:Asia/Riyadh}
prayer.api.url=${PRAYER_API_URL:https://api.aladhan.com/v1/timings}
prayer.api.country.default=${PRAYER_API_COUNTRY:Saudi Arabia}
prayer.api.method=${PRAYER_API_METHOD:4}
